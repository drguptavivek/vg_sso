# Proposed vhost for the standalone admin-console app (HR / delegated
# client-admin self-service dashboards), for a LAN-only reverse proxy.
#
# Deployment model this file assumes:
#   - nginx runs on a SEPARATE host from the docker host (an "external"
#     reverse proxy), and there are two such nginx instances: one serving
#     public/global traffic, one serving LAN-only traffic.
#   - This vhost belongs ONLY on the LAN nginx. Do not add it to the
#     global/public nginx's config under any hostname.
#   - The docker host's own firewall is configured separately (outside
#     nginx) to accept inbound connections to ADMIN_CONSOLE_PORT only from
#     the LAN nginx's IP address. That firewall rule is the primary control
#     - this vhost being LAN-only is defense in depth on top of it, not a
#     substitute for it.
#
# Placeholders to replace before use:
#   hr.internal.example   -> the real internal subdomain for this app,
#                            resolvable only on the LAN/VPN (must exactly
#                            match ADMIN_CONSOLE_APP_URL in .env - that
#                            value also becomes the redirect URI registered
#                            on the hr-client-admin-console client by
#                            step11-init)
#   10.0.0.50              -> the docker host's LAN-reachable IP (or an
#                            internal DNS name), i.e. where
#                            ADMIN_CONSOLE_BIND_IP is actually listening.
#                            Do not point this at 127.0.0.1 - that only
#                            works if nginx and the container share a host,
#                            which is not this deployment model.
#   3100                    -> ADMIN_CONSOLE_PORT.
#
# Every route on this app is an admin action - there is no "regular user"
# traffic here - so the whole hostname is locked down, not just /admin
# paths (contrast with sso2-vg-new-delhi.conf, which only IP-restricts
# /admin because that host also serves normal end-user login).

limit_req_zone $binary_remote_addr zone=admin_console_rate:10m rate=30r/m;

server {
  listen 80;
  listen [::]:80;
  server_name hr.internal.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name hr.internal.example;

  # TLS certs (replace with your actual paths - an internal CA or
  # self-signed cert is fine for a LAN-only host; still terminate TLS here
  # rather than serving this over plain HTTP).
  ssl_certificate     /etc/letsencrypt/live/hr.internal.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hr.internal.example/privkey.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  # Optional extra layer: restrict to a specific LAN subnet/VLAN instead of
  # "anything this nginx instance can see". Uncomment and adjust if not
  # every device on the LAN should reach this app.
  # allow 10.0.0.0/24;
  # deny all;

  location ~ ^/api/auth/(signin|callback)/ {
    limit_req zone=admin_console_rate burst=10 nodelay;
    proxy_pass http://10.0.0.50:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    limit_req zone=admin_console_rate burst=20 nodelay;
    proxy_pass http://10.0.0.50:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Next.js dev-mode HMR / websocket upgrade support, harmless in prod.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
