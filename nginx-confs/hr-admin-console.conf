# Proposed nginx vhost for the standalone admin-console app (HR / delegated
# client-admin self-service dashboards), kept off the public internet.
#
# Placeholders to replace before use:
#   hr.example.com   -> the real internal subdomain for this app
#                        (must exactly match ADMIN_CONSOLE_APP_URL in .env,
#                        including scheme - that value also becomes the
#                        redirect URI registered on the hr-client-admin-console
#                        client by step11-init)
#   192.168.1.34     -> allowed office/VPN IP(s). Add one `allow` line per
#                        address or CIDR range that should reach this app;
#                        everything else is denied.
#   127.0.0.1:3100   -> where the admin-console container is reachable from
#                        this nginx host. Matches ADMIN_CONSOLE_PORT in .env;
#                        the compose port publish should be loopback-only
#                        (127.0.0.1:${ADMIN_CONSOLE_PORT}:3100), not 0.0.0.0,
#                        so this nginx vhost is the only path in.
#
# Unlike sso2-vg-new-delhi.conf (which only IP-restricts the /admin paths
# and leaves normal user login open), every route on this app is an admin
# action - there is no "regular user" traffic here - so the entire
# hostname is IP-restricted, the same way sso1-master.conf locks down the
# master realm host.

limit_req_zone $binary_remote_addr zone=admin_console_rate:10m rate=30r/m;

server {
  listen 80;
  listen [::]:80;
  server_name hr.example.com;
  allow 192.168.1.34;
  deny all;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name hr.example.com;
  allow 192.168.1.34;
  deny all;

  # TLS certs (replace with your actual paths)
  ssl_certificate     /etc/letsencrypt/live/hr.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hr.example.com/privkey.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  # Extra protection on the NextAuth sign-in/callback routes.
  location ~ ^/api/auth/(signin|callback)/ {
    limit_req zone=admin_console_rate burst=10 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    limit_req zone=admin_console_rate burst=20 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Next.js dev-mode HMR / websocket upgrade support, harmless in prod.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
